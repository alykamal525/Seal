name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - uses: gradle/actions/setup-gradle@v3

    - name: Create signing key
      run: |
        PW=$(openssl rand -hex 16)
        keytool -genkeypair -keystore "$GITHUB_WORKSPACE/loka.jks" -alias loka -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Loka Downloader"
        {
          echo "keyAlias=loka"
          echo "keyPassword=$PW"
          echo "storeFile=$GITHUB_WORKSPACE/loka.jks"
          echo "storePassword=$PW"
        } > keystore.properties

    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew assembleGenericRelease

    - name: Rename APKs
      run: |
        cd app/build/outputs/apk/generic/release
        for f in Seal-*.apk; do
          n=$(echo "$f" | sed -E 's/^Seal-[^-]*-[^-]*-generic-//; s/-release\.apk$//')
          mv "$f" "LOKA-DOWNLOADER-$n.apk"
        done
        ls -la

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: loka-downloader-apk
        path: app/build/outputs/apk/generic/release/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: loka-${{ github.run_number }}
        name: LOKA DOWNLOADER build ${{ github.run_number }}
        files: app/build/outputs/apk/generic/release/*.apk
